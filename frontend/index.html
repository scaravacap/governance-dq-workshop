<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#315AA6">
  <title>Taller de gobierno y calidad de datos</title>
  <style>
    :root {
      --brand: #C8321E;
      --brand-dark: #8F2415;
      --brand-soft: #FDEEEA;
      --ink: #111827;
      --muted: #5E6878;
      --subtle: #8B95A5;
      --canvas: #F5F7FA;
      --card: #FFFFFF;
      --line: #DCE2EA;
      --ok: #2D7D46;
      --ok-soft: #EAF6EE;
      --warning: #A86109;
      --warning-soft: #FFF5DE;
      --radius: 16px;
      --shadow: 0 16px 42px rgba(24, 45, 78, 0.10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(49, 90, 166, 0.35);
      outline-offset: 3px;
    }
    ::selection { color: #fff; background: var(--brand); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      width: min(1200px, calc(100% - 40px));
      height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      cursor: pointer;
    }
    .brand img { width: 146px; height: auto; display: block; }
    .brand-divider { width: 1px; height: 32px; background: var(--line); }
    .brand-copy { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .tag {
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 750;
    }
    .github-link {
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .github-link:hover { color: var(--brand); }

    .hero {
      color: #fff;
      background:
        radial-gradient(circle at 84% 5%, rgba(255, 95, 70, 0.30), transparent 28%),
        linear-gradient(135deg, #0B2026 0%, #1B3139 55%, #16282E 100%);
      overflow: hidden;
    }
    .hero-inner {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 62px 0 56px;
      display: grid;
      grid-template-columns: 1.6fr 0.8fr;
      gap: 48px;
      align-items: end;
    }
    .eyebrow {
      margin: 0 0 13px;
      color: #BFD4F7;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .hero h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(36px, 5vw, 62px);
      line-height: 1.02;
      letter-spacing: -0.045em;
    }
    .hero p {
      max-width: 760px;
      margin: 22px 0 0;
      color: #E3ECFA;
      font-size: 17px;
      line-height: 1.65;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .hero-stat {
      min-height: 104px;
      padding: 19px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.09);
    }
    .hero-stat strong { display: block; font-size: 28px; }
    .hero-stat span { display: block; margin-top: 5px; color: #D5E2F6; font-size: 12px; line-height: 1.4; }

    .container {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 72px;
    }
    .setup {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 26px;
      align-items: center;
      margin-bottom: 40px;
      padding: 24px;
      border: 1px solid #C8D8F0;
      border-radius: var(--radius);
      background: var(--brand-soft);
    }
    .setup h2 { margin: 0 0 7px; font-size: 18px; }
    .setup p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .setup-links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 17px;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-weight: 750;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--brand); }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-secondary { color: var(--brand-dark); background: #fff; border-color: #E7C3BC; }
    .btn-secondary:hover { border-color: var(--brand); }
    .btn-dark { color: #fff; background: var(--ink); }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .section-heading h2 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
    .section-heading p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .progress-label { color: var(--muted); font-size: 13px; font-weight: 700; }
    .progress-track {
      width: 150px;
      height: 8px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #E1E6ED;
    }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--ok); transition: width 240ms ease; }

    .task-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .task-card {
      position: relative;
      min-height: 300px;
      padding: 26px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 2px 8px rgba(24, 45, 78, 0.04);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }
    .task-card:hover { transform: translateY(-3px); border-color: #B6C5DD; box-shadow: var(--shadow); }
    .task-card::after {
      content: "";
      position: absolute;
      right: -50px;
      bottom: -70px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--task-soft);
    }
    .task-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
    .task-number {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: var(--task-color);
      font-weight: 850;
    }
    .task-mode {
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--task-color);
      background: var(--task-soft);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .task-icon { position: relative; z-index: 1; margin-top: 27px; font-size: 38px; }
    .task-card h3 { position: relative; z-index: 1; margin: 15px 0 8px; font-size: 22px; letter-spacing: -0.025em; }
    .task-card p { position: relative; z-index: 1; max-width: 82%; margin-bottom: 36px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .task-meta { position: absolute; z-index: 1; left: 26px; bottom: 24px; color: var(--subtle); font-size: 12px; font-weight: 650; }
    .task-done {
      position: absolute;
      z-index: 2;
      right: 24px;
      bottom: 22px;
      display: none;
      color: var(--ok);
      font-size: 13px;
      font-weight: 800;
    }
    .task-card.done { border-color: #A9D5B7; }
    .task-card.done .task-done { display: block; }

    .detail-hero { color: #fff; background: var(--detail-color); }
    .detail-hero-inner {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 36px 0 38px;
    }
    .back {
      padding: 0;
      border: 0;
      color: rgba(255, 255, 255, 0.82);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }
    .back:hover { color: #fff; }
    .detail-title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      margin-top: 25px;
    }
    .detail-title-wrap { display: flex; align-items: center; gap: 20px; }
    .detail-icon {
      width: 64px;
      height: 64px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.13);
      font-size: 32px;
    }
    .detail-hero h1 { margin: 0; font-size: clamp(28px, 4vw, 43px); letter-spacing: -0.04em; }
    .detail-hero p { margin: 8px 0 0; color: rgba(255, 255, 255, 0.83); line-height: 1.55; }
    .complete-label {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 750;
    }
    .complete-label input { width: 19px; height: 19px; accent-color: var(--ok); }

    .detail-layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 98px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }
    .side h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; }
    .side ul { margin: 0; padding: 0; list-style: none; }
    .side li + li { margin-top: 9px; }
    .side a { color: var(--muted); text-decoration: none; font-size: 13px; line-height: 1.4; }
    .side a:hover { color: var(--brand); }
    .side-divider { height: 1px; margin: 18px 0; background: var(--line); }
    .side-meta { color: var(--subtle); font-size: 12px; line-height: 1.6; }

    .summary-card, .content-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }
    .summary-card { padding: 26px; margin-bottom: 18px; }
    .summary-card > p { margin: 0; color: var(--muted); line-height: 1.65; }
    .summary-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 24px;
    }
    .summary-columns h3 { margin: 0 0 10px; font-size: 14px; }
    .check-list { margin: 0; padding: 0; list-style: none; }
    .check-list li { position: relative; padding-left: 23px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .check-list li + li { margin-top: 8px; }
    .check-list li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); font-weight: 850; }
    .prereq-list li::before { content: "•"; color: var(--brand); }

    .content-card { padding: 28px; margin-bottom: 18px; scroll-margin-top: 94px; }
    .content-card h2 { margin: 0; font-size: 22px; letter-spacing: -0.025em; }
    .content-card .intro { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .steps { margin: 22px 0 0; padding: 0; list-style: none; counter-reset: workshop-step; }
    .steps li {
      position: relative;
      min-height: 42px;
      padding: 2px 0 18px 48px;
      color: #364152;
      font-size: 14px;
      line-height: 1.58;
      counter-increment: workshop-step;
    }
    .steps li::before {
      content: counter(workshop-step);
      position: absolute;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      font-size: 12px;
      font-weight: 850;
    }
    .steps li:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 14px;
      top: 34px;
      bottom: 2px;
      width: 1px;
      background: var(--line);
    }
    code { padding: 1px 5px; border-radius: 4px; background: rgba(27, 49, 57, 0.08); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
    .note, .expected {
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .note { color: #7A4A09; background: var(--warning-soft); border: 1px solid #F0D9A3; }
    .expected { color: #245D36; background: var(--ok-soft); border: 1px solid #BFE1C9; }
    .note strong, .expected strong { display: block; margin-bottom: 3px; color: inherit; }

    .code-wrap { margin-top: 20px; }
    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 14px;
      border-radius: 12px 12px 0 0;
      color: #D5DCEC;
      background: #182132;
      font-size: 12px;
      font-weight: 750;
    }
    .copy-btn {
      padding: 6px 11px;
      border: 1px solid #465269;
      border-radius: 999px;
      color: #fff;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
    }
    .copy-btn.copied { color: #D9F5E2; border-color: #67B57F; }
    pre {
      margin: 0;
      max-height: 430px;
      padding: 18px;
      overflow: auto;
      border-radius: 0 0 12px 12px;
      color: #E8EDF7;
      background: #101726;
      font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .prompt-wrap pre { max-height: 580px; }
    .docs { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 20px; }
    .doc-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--brand-dark);
      text-decoration: none;
      font-size: 12px;
      font-weight: 750;
    }
    .doc-link:hover { border-color: var(--brand); background: var(--brand-soft); }

    .detail-nav { display: flex; justify-content: space-between; gap: 14px; margin-top: 28px; }
    footer {
      padding: 28px 20px;
      color: #AAB3C2;
      background: #111827;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }
    footer a { color: #D7E5FF; }

    .error-state {
      width: min(680px, calc(100% - 40px));
      margin: 80px auto;
      padding: 30px;
      border: 1px solid #F0C6C6;
      border-radius: var(--radius);
      color: #7A2020;
      background: #FFF7F7;
    }

    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; }
      .hero-stats { max-width: 470px; }
      .detail-layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .task-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 650px) {
      .topbar-inner, .hero-inner, .container, .detail-hero-inner { width: min(100% - 28px, 1200px); }
      .topbar-inner { height: 64px; }
      .brand img { width: 116px; }
      .brand-divider, .brand-copy, .github-link { display: none; }
      .hero-inner { padding: 44px 0; }
      .hero-stats { grid-template-columns: 1fr 1fr; }
      .setup { grid-template-columns: 1fr; }
      .setup-links { justify-content: flex-start; }
      .summary-columns { grid-template-columns: 1fr; }
      .detail-title-row { align-items: flex-start; flex-direction: column; }
      .content-card, .summary-card { padding: 22px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="goHome()" role="button" tabindex="0" aria-label="Volver al inicio">
        <img src="img/databricks-symbol.svg" alt="Databricks" style="width:34px">
        <span class="brand-divider"></span>
        <span class="brand-copy">Taller de gobierno y calidad de datos</span>
      </div>
      <div class="topbar-actions">
        <span class="tag">Taller guiado · Free Edition</span>
        <a class="github-link" href="https://github.com/scaravacap/governance-dq-workshop" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer>
    Taller de gobierno y calidad de datos · Datos 100% sintéticos ·
    <a href="https://www.databricks.com" target="_blank" rel="noopener">Databricks</a>
    <br>Material de habilitación. Verifica los resultados antes de usarlos en una decisión operacional.
  </footer>

  <script>
    const REPO = "https://github.com/scaravacap/governance-dq-workshop";
    const state = {
      workshop: null,
      tasks: [],
      detail: null,
      detailIndex: -1,
      done: loadDone()
    };

    function esc(value) {
      const node = document.createElement("div");
      node.textContent = value == null ? "" : String(value);
      return node.innerHTML;
    }

    // Texto con `código` y **negrita** sencillos, siempre escapado primero.
    function rich(value) {
      return esc(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function softColor(hex) {
      const clean = String(hex || "#315AA6").replace("#", "");
      if (!/^[0-9a-fA-F]{6}$/.test(clean)) return "#EAF0FA";
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, 0.11)`;
    }

    function loadDone() {
      try { return new Set(JSON.parse(localStorage.getItem("gobierno-dq-done") || "[]")); }
      catch (_) { return new Set(); }
    }

    function saveDone() {
      localStorage.setItem("gobierno-dq-done", JSON.stringify([...state.done]));
    }

    async function init() {
      try {
        const [workshopResponse, tasksResponse] = await Promise.all([
          fetch("/api/workshop"),
          fetch("/api/tasks")
        ]);
        if (!workshopResponse.ok || !tasksResponse.ok) throw new Error("No pude cargar el contenido.");
        state.workshop = await workshopResponse.json();
        state.tasks = await tasksResponse.json();
        renderHome();
      } catch (error) {
        document.querySelector("#app").innerHTML = `
          <div class="error-state">
            <strong>No pude cargar el taller.</strong>
            <p>${esc(error.message)}</p>
          </div>`;
      }
    }

    function progress() {
      const total = state.tasks.length || 1;
      return Math.round((state.done.size / total) * 100);
    }

    function renderHome() {
      state.detail = null;
      state.detailIndex = -1;
      history.replaceState(null, "", location.pathname);
      const workshop = state.workshop || {};
      const nbCount = state.tasks.filter(task => task.mode.includes("Notebook")).length;
      const uiCount = state.tasks.filter(task => task.mode.includes("Interfaz")).length;
      const cards = state.tasks.map(task => `
        <article
          class="task-card ${state.done.has(task.id) ? "done" : ""}"
          style="--task-color:${esc(task.color)};--task-soft:${softColor(task.color)}"
          onclick="openTask('${task.id}')"
          role="button"
          tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTask('${task.id}')}"
          aria-label="Abrir tarea ${task.index}: ${esc(task.title)}">
          <div class="task-top">
            <span class="task-number">${String(task.index).padStart(2, "0")}</span>
            <span class="task-mode">${esc(task.mode)}</span>
          </div>
          <div class="task-icon" aria-hidden="true">${esc(task.icon)}</div>
          <h3>${esc(task.title)}</h3>
          <p>${rich(task.subtitle)}</p>
          <span class="task-meta">${task.estimatedMinutes} min · ${esc(task.product)}</span>
          <span class="task-done">✓ Completada</span>
        </article>
      `).join("");

      document.querySelector("#app").innerHTML = `
        <section class="hero">
          <div class="hero-inner">
            <div>
              <p class="eyebrow">${esc(workshop.eyebrow)}</p>
              <h1>${esc(workshop.title)}</h1>
              <p>${esc(workshop.subtitle)}</p>
            </div>
            <div class="hero-stats">
              <div class="hero-stat"><strong>${state.tasks.length}</strong><span>tareas prácticas</span></div>
              <div class="hero-stat"><strong>${workshop.estimatedMinutes || 0}</strong><span>minutos estimados</span></div>
              <div class="hero-stat"><strong>${nbCount}</strong><span>tareas con notebook</span></div>
              <div class="hero-stat"><strong>${uiCount}</strong><span>tareas en la interfaz</span></div>
            </div>
          </div>
        </section>
        <div class="container">
          <section class="setup">
            <div>
              <h2>Empiecen por preparar el catálogo</h2>
              <p>Clonen el repositorio en un Git Folder y ejecuten <b>${esc(workshop.setupNotebook)}</b>. El notebook crea el catálogo <b>taller_gobierno</b> con cinco tablas sintéticas de un banco regional y errores de calidad sembrados a propósito.</p>
            </div>
            <div class="setup-links">
              <a class="btn btn-primary" href="${REPO}/blob/main/notebooks/01_setup_taller.py" target="_blank" rel="noopener">Abrir notebook</a>
              <a class="btn btn-secondary" href="${REPO}/blob/main/README.md" target="_blank" rel="noopener">Ver preparación</a>
            </div>
          </section>

          <div class="section-heading">
            <div>
              <h2>Las tareas del taller</h2>
              <p>${esc(workshop.dataNotice)}</p>
            </div>
            <div>
              <div class="progress-label">${state.done.size}/${state.tasks.length} completadas</div>
              <div class="progress-track"><div class="progress-fill" style="width:${progress()}%"></div></div>
            </div>
          </div>
          <section class="task-grid">${cards}</section>
        </div>`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function openTask(id) {
      const response = await fetch(`/api/tasks/${encodeURIComponent(id)}`);
      if (!response.ok) return;
      state.detail = await response.json();
      state.detailIndex = state.tasks.findIndex(task => task.id === id);
      history.replaceState(null, "", `#${id}`);
      renderDetail();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      if (state.tasks.length) renderHome();
    }

    function toggleDone(id, checked) {
      if (checked) state.done.add(id);
      else state.done.delete(id);
      saveDone();
    }

    function copyById(id, button) {
      const value = document.getElementById(id)?.textContent || "";
      navigator.clipboard.writeText(value).then(() => {
        const original = button.textContent;
        button.textContent = "✓ Copiado";
        button.classList.add("copied");
        setTimeout(() => {
          button.textContent = original;
          button.classList.remove("copied");
        }, 1800);
      });
    }

    function renderList(items, extraClass = "") {
      return `<ul class="check-list ${extraClass}">${(items || []).map(item => `<li>${rich(item)}</li>`).join("")}</ul>`;
    }

    function renderDocs(docs) {
      if (!docs || !docs.length) return "";
      return `<div class="docs">${docs.map(doc => `
        <a class="doc-link" href="${esc(doc.url)}" target="_blank" rel="noopener">Documentación · ${esc(doc.label)} ↗</a>
      `).join("")}</div>`;
    }

    function renderCode(section, index) {
      if (!section.code) return "";
      const id = `section-code-${index}`;
      return `
        <div class="code-wrap">
          <div class="code-head">
            <span>${esc(section.codeLabel || "Código")}</span>
            <button class="copy-btn" onclick="copyById('${id}', this)">Copiar</button>
          </div>
          <pre id="${id}">${esc(section.code)}</pre>
        </div>`;
    }

    function renderSection(section, index) {
      return `
        <section class="content-card" id="section-${index}">
          <h2>${esc(section.title)}</h2>
          ${section.intro ? `<p class="intro">${rich(section.intro)}</p>` : ""}
          <ol class="steps">${(section.steps || []).map(step => `<li>${rich(step)}</li>`).join("")}</ol>
          ${section.note ? `<div class="note"><strong>Tengan en cuenta</strong>${rich(section.note)}</div>` : ""}
          ${section.expected ? `<div class="expected"><strong>Resultado esperado</strong>${rich(section.expected)}</div>` : ""}
          ${renderCode(section, index)}
          ${renderDocs(section.docs)}
        </section>`;
    }

    function renderDetail() {
      const task = state.detail;
      if (!task) return;
      const next = state.tasks[state.detailIndex + 1];
      const previous = state.tasks[state.detailIndex - 1];
      const sections = task.sections || [];
      const sectionNav = sections.map((section, index) => `
        <li><a href="#section-${index}">${index + 1}. ${esc(section.title)}</a></li>
      `).join("");

      const prompt = task.prompt ? `
        <section class="content-card prompt-wrap" id="workshop-prompt">
          <h2>Prompt para Genie Code</h2>
          <p class="intro">Cópialo completo. Revisa el plan que genere Genie Code antes de aceptar cambios.</p>
          <div class="code-wrap">
            <div class="code-head">
              <span>Prompt completo</span>
              <button class="copy-btn" onclick="copyById('full-prompt', this)">Copiar prompt</button>
            </div>
            <pre id="full-prompt">${esc(task.prompt)}</pre>
          </div>
        </section>` : "";

      document.querySelector("#app").innerHTML = `
        <section class="detail-hero" style="--detail-color:${esc(task.color)}">
          <div class="detail-hero-inner">
            <button class="back" onclick="goHome()">← Volver a las tareas</button>
            <div class="detail-title-row">
              <div class="detail-title-wrap">
                <span class="detail-icon" aria-hidden="true">${esc(task.icon)}</span>
                <div>
                  <p class="eyebrow">Tarea ${task.index} · ${esc(task.mode)}</p>
                  <h1>${esc(task.title)}</h1>
                  <p>${rich(task.subtitle)}</p>
                </div>
              </div>
              <label class="complete-label">
                <input type="checkbox" ${state.done.has(task.id) ? "checked" : ""} onchange="toggleDone('${task.id}', this.checked)">
                Marcar como completada
              </label>
            </div>
          </div>
        </section>

        <div class="container detail-layout">
          <aside class="side">
            <h3>En esta tarea</h3>
            <ul>
              ${task.prompt ? `<li><a href="#workshop-prompt">Prompt para Genie Code</a></li>` : ""}
              ${sectionNav}
            </ul>
            <div class="side-divider"></div>
            <div class="side-meta">${task.estimatedMinutes} minutos<br>${esc(task.product)}<br>${esc(task.mode)}</div>
          </aside>

          <div>
            <section class="summary-card">
              <p>${rich(task.description)}</p>
              <div class="summary-columns">
                <div>
                  <h3>Al terminar tendrás</h3>
                  ${renderList(task.outcomes)}
                </div>
                <div>
                  <h3>Antes de empezar</h3>
                  ${renderList(task.prerequisites, "prereq-list")}
                </div>
              </div>
            </section>
            ${prompt}
            ${sections.map(renderSection).join("")}
            <nav class="detail-nav" aria-label="Navegación entre tareas">
              ${previous ? `<button class="btn btn-secondary" onclick="openTask('${previous.id}')">← Tarea ${previous.index}</button>` : "<span></span>"}
              ${next ? `<button class="btn btn-dark" onclick="openTask('${next.id}')">Tarea ${next.index} →</button>` : `<button class="btn btn-primary" onclick="goHome()">Ver progreso</button>`}
            </nav>
          </div>
        </div>`;
    }

    document.querySelector(".brand").addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") goHome();
    });

    init();
  </script>
</body>
</html>
